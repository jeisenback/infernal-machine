[project]
name = "infernal-machine"
version = "0.1.0"
description = "A Magic: The Gathering engine"
requires-python = ">=3.11"

[project.scripts]
infernal-server = "infernal_machine.server:main"
infernal-client = "infernal_machine.client:main"
infernal-web = "infernal_machine.web:main"

[tool.setuptools]
packages = ["infernal_machine", "infernal_machine.effects"]

[tool.setuptools.package-data]
infernal_machine = ["web.html"]

[tool.pyright]
include = ["infernal_machine"]
pythonVersion = "3.11"  # the oldest version the project supports; CI runs the tests on 3.11 and 3.13
