name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the test suite
        run: python -m unittest discover -s tests -t .

  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true  # not blocking while the first findings are worked off (#283); delete this line once the count is 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyright (CI only; the engine itself has no dependencies)
        run: python -m pip install pyright==1.1.414
      - name: Check the type annotations of infernal_machine
        run: |
          status=0
          python -m pyright > pyright.txt || status=$?
          cat pyright.txt
          echo "pyright: $(tail -n 1 pyright.txt)" >> "$GITHUB_STEP_SUMMARY"
          exit $status
