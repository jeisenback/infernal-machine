name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Remember how long each test module took, to balance the processes next time
        uses: actions/cache@v4
        with:
          path: .cache/test_times.json
          key: test-times-${{ matrix.python-version }}-${{ github.run_id }}
          restore-keys: test-times-${{ matrix.python-version }}-
      - name: Run the test suite, across the runner's cores (#519)
        run: |
          echo "cores: $(nproc)"
          python tools/run_tests.py

  typecheck:
    name: typecheck (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pyright (CI only; the engine itself has no dependencies)
        run: python -m pip install pyright==1.1.414
      - name: No type errors (#309)
        run: python -m pyright
