name: coverage audit
on:
  schedule:
    - cron: "37 6 * * 1"  # Mondays, after the precon report and the bot games
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Get this week's cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/commander_pool.json
            .cache/standard_pool.json
          key: pools-${{ steps.week.outputs.week }}
      - name: How much of the Commander card pool the engine understands
        run: python tools/coverage_audit.py --mechanisms --next --json coverage-audit.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: How much of the Standard card pool the engine understands
        run: python tools/coverage_audit.py --format standard --next --json coverage-audit-standard.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Which rules-text templates are unused, and which sentences two of them read
        run: python tools/template_audit.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Whether the fully playable cards actually play
        run: python tools/play_smoke.py | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Whether the costs of their activated abilities can be paid
        run: python tools/ability_smoke.py | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-audit
          path: |
            coverage-audit.json
            coverage-audit-standard.json
  formats:  # one line for each constructed format beside Standard (#522), so a gain shows in every format it touches
    # Only when the workflow is run by hand ("Run workflow", or `gh workflow run "coverage audit"`): it spends about 25 runner-minutes,
    # too many for every Monday on the Actions budget; between runs, `coverage_audit.py --format NAME` measures a pool locally.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45  # five pools from Scryfall's search API, one page at a time: about 22 minutes in all when none is cached
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Get this week's cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            .cache/pauper_pool.json
            .cache/pioneer_pool.json
            .cache/modern_pool.json
            .cache/legacy_pool.json
            .cache/vintage_pool.json
          key: format-pools-${{ steps.week.outputs.week }}
      - name: How much of each format's card pool the engine plays
        shell: bash
        run: |
          {
            echo "## How much of each format's card pool the engine plays"
            echo
            for format in pauper pioneer modern legacy vintage; do
              # (the whole output, then its first line: cutting the pipe short would read as a failure)
              if out=$(python tools/coverage_audit.py --format "$format" --top 1); then
                line=${out%%$'\n'*}
                echo "- ${line#'## Coverage audit: '}"
              else
                echo "- ${format}: the pool could not be fetched or measured"
              fi
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
