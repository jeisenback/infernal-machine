name: coverage audit
on:
  schedule:
    - cron: "37 6 * * 1"  # Mondays, after the precon report and the bot games
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Get this week's cache key
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .cache/commander_pool.json
          key: commander-pool-${{ steps.week.outputs.week }}
      - name: How much of the Commander card pool the engine understands
        run: python tools/coverage_audit.py --json coverage-audit.json | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Whether the fully playable cards actually play
        run: python tools/play_smoke.py | tee -a "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-audit
          path: coverage-audit.json
