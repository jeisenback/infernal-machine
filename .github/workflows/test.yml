name: Tests
on: [push, pull_request]
# The job checks out the code and runs the tests, so it needs to read the repository and nothing else.
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t .
